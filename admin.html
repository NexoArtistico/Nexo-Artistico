<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Panel Admin — Nexo Artístico</title>
<link rel="icon" type="image/png" href="https://res.cloudinary.com/ojp6mrxi/image/upload/f_auto,q_auto/NXA_LOGO" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0c0a1e;--s1:#13112b;--s2:#1b1840;--line:#2a2660;--txt:#ece9ff;--mut:#9a95c9;--pri:#8b6cff;--pri2:#b3a0ff;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h3,b{font-family:Sora,Inter,sans-serif;font-weight:600}h1,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri2);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:8px 14px;text-decoration:none;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--pri2)}.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}.btn.pri:hover{background:#7a58f5}
.btn.ghost{background:transparent}.btn.sm{padding:5px 10px;font-size:13px}.btn.icon{padding:7px 10px}.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--pri2);box-shadow:0 0 0 3px #8b6cff2e}
textarea{min-height:96px;resize:vertical}label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 50% -10%,#3a1f8c55,transparent)}
.card{width:100%;max-width:380px;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:30px}
.card img{width:44px;height:44px;border-radius:12px;margin-bottom:16px}.card h1{font-size:22px}.card p{color:var(--mut);margin:6px 0 4px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
/* shell */
#app{display:none;grid-template-columns:252px 1fr;min-height:100vh}
aside{background:var(--s1);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;gap:11px;align-items:center;padding:2px 8px 18px}.brand img{width:36px;height:36px;border-radius:10px}
.brand b{display:block;font-size:15px;line-height:1.2}.brand span{font-size:12px;color:var(--mut)}
#nav{flex:1}.grp{font-size:12px;color:var(--mut);padding:16px 10px 6px;opacity:.8}
.nv{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;border-radius:9px;padding:8px 10px;color:var(--mut);text-align:left}
.nv:hover{background:var(--s2);color:var(--txt)}.nv.on{background:#8b6cff24;color:#fff;box-shadow:inset 2px 0 0 var(--pri)}
.nv span{flex:1}.nv i{font-style:normal;font-size:12px;color:var(--mut);min-width:18px;text-align:right}
.sfoot{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.me{display:flex;align-items:center;gap:8px;justify-content:space-between}.me span{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:26px 30px;min-width:0}
.top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.ttl{margin-right:auto}.ttl h1{font-size:24px;letter-spacing:-.01em}.ttl p{color:var(--mut);margin-top:2px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tools input{width:230px}body.is-home .tools{display:none}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg button{background:none;border:0;padding:8px 11px;color:var(--mut);display:flex}
.seg button.on{background:var(--s2);color:#fff}.mob{display:none}
/* tabla */
.tw{background:var(--s1);border:1px solid var(--line);border-radius:14px;overflow:auto}
table{border-collapse:collapse;width:100%}th,td{padding:10px 14px;text-align:left;border-bottom:1px solid #221f52;vertical-align:middle}
th{font-size:13px;font-weight:500;color:var(--mut);background:var(--s1);position:sticky;top:0;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}tbody tr:hover td{background:#17143a}tr.hid td:not(:last-child){opacity:.5}
td.t{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}td.ttl2{color:var(--txt);font-weight:500}
td img{width:46px;height:46px;object-fit:cover;border-radius:9px;display:block;background:var(--s2)}
.act{display:flex;gap:4px;justify-content:flex-end;white-space:nowrap}
.ib{width:32px;height:32px;display:grid;place-items:center;background:none;border:1px solid transparent;border-radius:8px;color:var(--mut)}
.ib:hover{background:var(--s2);color:var(--txt)}.ib.bad:hover{color:var(--bad);border-color:#fb718555}
.sw{width:34px;height:20px;border-radius:99px;background:#2a2660;border:0;position:relative;padding:0;transition:background .15s}
.sw i{position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#cfcaff;transition:transform .15s}
.sw.on{background:var(--ok)}.sw.on i{transform:translateX(14px);background:#06281c}
.bd{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--s2);border:1px solid var(--line);color:var(--mut)}
.bd.activo{color:var(--ok);border-color:#34d39955}.bd.pendiente{color:var(--warn);border-color:#fbbf2455}.bd.finalizado{color:var(--pri2);border-color:#8b6cff55}
.empty{padding:70px 20px;text-align:center;color:var(--mut)}.empty b{display:block;color:var(--txt);font-size:17px;margin-bottom:4px}
.sk{height:62px;border-bottom:1px solid #221f52;background:linear-gradient(90deg,transparent,#8b6cff14,transparent) 0 0/200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}@media(prefers-reduced-motion:reduce){.sk{animation:none}*{transition:none!important}}
/* galería */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.gc{background:var(--s1);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.gc.hid{opacity:.55}
.gi{aspect-ratio:4/3;background:var(--s2);display:grid;place-items:center;color:var(--mut);font-size:13px}.gi img{width:100%;height:100%;object-fit:cover;display:block}
.gb{padding:12px 14px 4px}.gb b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gb small{color:var(--mut)}
.gf{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 10px 14px}
/* resumen */
.home{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.hc{text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:4px}
.hc:hover{border-color:var(--pri2);background:var(--s2)}.hi{width:40px;height:40px;border-radius:11px;background:#8b6cff24;color:var(--pri2);display:grid;place-items:center;margin-bottom:10px}
.hc b{font-size:15px}.hc em{font-style:normal;color:var(--mut)}
/* diálogos */
dialog{background:var(--s1);color:var(--txt);border:1px solid var(--line);border-radius:18px;padding:0;width:min(580px,94vw);max-height:90vh;box-shadow:0 30px 80px #000a}
dialog::backdrop{background:#05030fcc;backdrop-filter:blur(3px)}#cdlg{width:min(400px,92vw)}
.mh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.mh h3{font-size:17px}
.mb{padding:2px 22px 10px;overflow:auto;max-height:62vh}.mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.chk{display:flex;align-items:center;gap:9px;margin-top:16px}.chk input{width:auto}
.up{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:13px;color:var(--mut)}.prev{margin-top:10px;max-height:120px;border-radius:10px;border:1px solid var(--line)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--ok);padding:10px 18px;border-radius:11px;display:none;z-index:99;box-shadow:0 10px 30px #0008}#toast.bad{border-color:var(--bad)}
#scrim{display:none}
#dlg{width:min(1240px,96vw)}.split{display:grid;grid-template-columns:minmax(0,500px) minmax(0,1fr)}
.pv{border-left:1px solid var(--line);background:var(--s2);display:flex;flex-direction:column;min-width:0}
.pvh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;font-weight:500}
.pvb{flex:none;display:flex;justify-content:center;padding:0 16px;height:max(380px,calc(62vh + 20px))}
#pvf{width:100%;height:100%;border:1px solid var(--line);border-radius:10px;background:#05030f;transition:width .2s}
.pvn{margin:0;padding:10px 16px;color:var(--warn);font-size:13px;min-height:38px}
/* ---------- mejoras de uso ---------- */
th[data-c]{cursor:pointer;user-select:none}th[data-c]:hover{color:var(--txt)}th .ar{font-size:10px;margin-left:5px;color:var(--pri2)}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}
.st{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px 18px}.st b{display:block;font-size:26px;line-height:1.15}.st span{color:var(--mut);font-size:13px}
.hc .hdn{color:var(--warn)}
#toast button{margin-left:14px;background:none;border:0;color:var(--pri2);font-weight:600;text-decoration:underline;padding:0}
.up.drag{outline:2px dashed var(--pri2);outline-offset:5px;border-radius:8px}
.inv,.inv:focus{border-color:var(--bad)!important;box-shadow:0 0 0 3px #fb71852e!important}
kbd{font:600 11px Inter,sans-serif;background:var(--s2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--mut)}
.hint{color:var(--mut);font-size:12px;margin-right:auto;align-self:center}
/* ---------- selección, arrastre, configuración ---------- */
.cs{width:1%;white-space:nowrap}th.cs,td.cs{padding-right:4px}
.ck,.ck-all{width:18px;height:18px;padding:0;margin:0;accent-color:var(--pri);cursor:pointer;vertical-align:middle;box-shadow:none}
.dg{display:inline-grid;place-items:center;width:22px;height:30px;color:var(--mut);cursor:grab;touch-action:none;user-select:none;border-radius:6px;margin-right:4px;vertical-align:middle;font-size:15px;letter-spacing:-3px;line-height:1}
.dg:hover{background:var(--s2);color:var(--txt)}
.dragging{opacity:.45}body.dragging-now,body.dragging-now *{cursor:grabbing!important;user-select:none}
tr.drop-b td{box-shadow:inset 0 3px 0 var(--pri2)}tr.drop-a td{box-shadow:inset 0 -3px 0 var(--pri2)}
.gc.drop-b{box-shadow:-4px 0 0 var(--pri2)}.gc.drop-a{box-shadow:4px 0 0 var(--pri2)}
tbody tr.sel td{background:#8b6cff14}.gc.sel{border-color:var(--pri2)}
.gi{position:relative}.gck{position:absolute;top:8px;left:8px;background:#0c0a1eb8;border-radius:8px;padding:6px;display:grid;place-items:center;margin:0;z-index:1}
.gc .dg{position:absolute;top:8px;right:8px;background:#0c0a1eb8;margin:0;z-index:1}
#bulk{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:25;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--pri2);border-radius:14px;padding:8px 10px 8px 16px;box-shadow:0 14px 40px #000b}
body.has-sel #bulk{display:flex}#bulk b{margin-right:6px;font-size:14px;white-space:nowrap}
.btn.bad{color:var(--bad)}.btn.bad:hover{border-color:var(--bad)}
.fh{margin-top:6px;display:flex;align-items:center;gap:10px;font-size:12px}.fh:empty{display:none}.fh .ok{color:var(--ok)}.fh .warn{color:var(--warn)}.fh .err{color:var(--bad)}
.fh img.yt{height:52px;border-radius:6px;border:1px solid var(--line)}
.hlp{display:block;color:var(--mut);font-size:12px;margin-top:5px}
.cfg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:20px;align-items:start}
.cfg-pv{position:sticky;top:20px;background:var(--s1);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.cfg-pv .pvb{height:min(72vh,720px);padding-bottom:12px}
.cfgg{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:6px 20px 20px;margin-bottom:16px}
.cfgg h3{font-size:15px;padding:14px 0 0;color:var(--pri2)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.fld{min-width:0}.fld.full{grid-column:1/-1}
.fld label{display:flex;align-items:center;justify-content:space-between}
.savebar{display:none;position:sticky;bottom:14px;z-index:15;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--pri2);border-radius:14px;padding:10px 12px 10px 18px;box-shadow:0 14px 40px #000b;margin-top:6px}
.savebar.on{display:flex}.savebar span{margin-right:auto}#cfgpvt{display:none}
body.is-cfg #q,body.is-cfg #flt,body.is-cfg #seg{display:none!important}
#pvf,#cfgpv{width:100%;height:100%;border:1px solid var(--line);border-radius:10px;background:#05030f;transition:width .2s}
/* ---------- responsive ---------- */
html{-webkit-text-size-adjust:100%}
aside{height:100vh;height:100dvh}
.mbar,#pvt{display:none}
body.lock{overflow:hidden}
.tw{-webkit-overflow-scrolling:touch}
td.t{min-width:90px}
@media(max-width:1180px){th:last-child,td:last-child{position:sticky;right:0;background:var(--s1);box-shadow:-10px 0 12px -8px #000a;padding-left:8px}tbody tr:hover td:last-child{background:#17143a}main{padding:22px 22px}.tools input{width:190px}#dlg{width:min(980px,96vw)}.split{grid-template-columns:minmax(0,420px) minmax(0,1fr)}}
@media(max-width:900px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:40;transform:translateX(-102%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;box-shadow:none;padding-bottom:max(18px,env(safe-area-inset-bottom))}
  body.nav-open aside{transform:none;visibility:visible;transition:transform .22s ease;box-shadow:12px 0 40px #000a}
  body.nav-open #scrim{display:block;position:fixed;inset:0;background:#000a;z-index:35;backdrop-filter:blur(2px)}
  .nv{padding:11px 12px}
  .mbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:#0c0a1ee6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .mbar .btn.icon{width:42px;height:42px;font-size:18px;padding:0}
  .mbar img{width:30px;height:30px;border-radius:9px}.mbar b{font-size:15px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  main{padding:0 16px calc(96px + env(safe-area-inset-bottom))}
  .mbar{margin:0 -16px 16px}
  .top{gap:12px}.ttl{flex:1 1 100%;margin-right:0}.ttl h1{font-size:22px}
  .tools{flex:1 1 100%;flex-wrap:nowrap}.tools input{flex:1;min-width:0;width:auto}
  /* diálogo a pantalla completa */
  dialog#dlg{width:100vw;max-width:100vw;height:100vh;height:100dvh;max-height:none;border-radius:0;border:0;margin:0}
  dialog#dlg[open]{display:flex;flex-direction:column}
  .mh{position:sticky;top:0;background:var(--s1);z-index:2;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
  .mh .btn{width:40px;height:40px}
  .split{display:block;flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
  .mb{max-height:none;overflow:visible;padding:2px 16px 18px}
  #ferr{padding:0 16px!important}
  .pv{display:none;border-left:0;border-top:1px solid var(--line)}
  #dlg.pv-open .pv{display:flex}
  .pvb{height:min(70vh,520px);height:min(70dvh,520px)}
  .mf{padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:var(--s1);gap:8px}
  #pvt{display:inline-flex}.mf .btn{min-height:44px}
  .mf #dc{margin-left:auto}
  /* campos cómodos al tacto (16px evita el zoom de iOS) */
  input,select,textarea{font-size:16px;padding:11px 12px}
  .btn{min-height:42px}.btn.sm{min-height:36px}
  .ib{width:40px;height:40px}.sw{width:44px;height:26px}.sw i{top:4px;left:4px;width:18px;height:18px}.sw.on i{transform:translateX(18px)}
  .chk input{width:22px;height:22px}
  .gal{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
}
@media(max-width:700px){
  /* tabla → tarjetas */
  .tw{background:none;border:0;border-radius:0;overflow:visible}
  table,tbody{display:block}thead{display:none}td:last-child{position:static;background:none;box-shadow:none;padding-left:0}
  tbody tr{display:grid;grid-template-columns:1fr;gap:2px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:6px 14px 4px;margin-bottom:12px}
  tbody tr:hover td{background:none}
  td{display:flex;justify-content:space-between;align-items:center;gap:14px;border-bottom:1px solid #221f52;padding:9px 0;text-align:right;min-width:0}
  td::before{content:attr(data-label);flex:none;font-size:12px;color:var(--mut);text-align:left}
  td.t{max-width:none;white-space:normal;overflow:visible;text-overflow:clip;display:flex;word-break:break-word;min-width:0}
  td.t>*,td.t{overflow-wrap:anywhere}
  td.ttl2{font-size:15px}
  td.cimg{justify-content:flex-start;padding-top:10px}td.cimg::before{display:none}td.cimg img{width:100%;height:150px;border-radius:10px}
  td.cact{border-bottom:0;justify-content:flex-end;padding:8px 0 6px}td.cact::before{display:none}
  td.cact .act{width:100%;justify-content:space-between}
  td.cact .ib{width:44px;height:44px;border-color:var(--line)}
  .sk{height:120px;border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
  .tw:has(.sk){display:block}
  .home{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.hc{padding:14px}.hi{width:36px;height:36px;margin-bottom:6px}
  #toast{left:16px;right:16px;transform:none;bottom:calc(88px + env(safe-area-inset-bottom));text-align:center}
  /* botón flotante para añadir */
  body:not(.is-home) #add{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:15;min-height:48px;padding:0 20px;border-radius:99px;box-shadow:0 10px 30px #0009,0 0 0 1px #ffffff1a}
  .tools{flex-wrap:wrap}.tools input{flex:1 1 100%}.tools .seg{margin-left:auto}.tools #flt{margin-left:0}
  .seg button{padding:10px 14px}
  .card{padding:24px 20px}
  .brand{padding-bottom:14px}
}
@media(max-width:600px){.sum{gap:8px}.st{padding:10px 12px}.st b{font-size:20px}.st span{font-size:12px}.hint{display:none}}
@media(max-width:400px){
  main{padding-left:12px;padding-right:12px}.mbar{padding-left:12px;padding-right:12px;margin-left:-12px;margin-right:-12px}
  .gal{grid-template-columns:1fr 1fr;gap:10px}.gb{padding:10px 10px 2px}.gf{padding:6px 6px 8px 10px}.gf .ib{width:36px;height:36px}
  .home{grid-template-columns:1fr}
  .mf .btn{padding-left:10px;padding-right:10px}
}
@media(max-width:600px){#dev{display:none}.pvh span{font-size:13px}}
@media(max-height:520px) and (orientation:landscape){.pvb{height:300px}#login{place-items:start center}}
@media(max-width:1180px){.cfg{grid-template-columns:1fr}.cfg-pv{display:none;position:static}.cfg-pv.show{display:flex}#cfgpvt{display:inline-flex}}
@media(max-width:700px){
  .fg{grid-template-columns:1fr}
  .savebar{bottom:calc(12px + env(safe-area-inset-bottom));flex-wrap:wrap;padding:10px 12px}.savebar span{flex:1 1 100%}.savebar .btn{flex:1}
  #bulk{left:12px;right:12px;transform:none;bottom:calc(12px + env(safe-area-inset-bottom));flex-wrap:wrap;gap:8px;padding:10px 12px}#bulk b{flex:1 1 100%;margin:0}#bulk .btn{flex:1;min-height:42px}#bulk .btn.ghost{flex:0 0 46px}body.has-sel #toast{bottom:calc(126px + env(safe-area-inset-bottom))}body.has-sel main{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
  body.has-sel #add{display:none!important}
  body.is-cfg #add{position:static!important;min-height:42px;padding:8px 14px;border-radius:9px;box-shadow:none}

function showHint(key, v, tbl) { var el = $("h_" + key); if (el) el.innerHTML = hintHTML(urlInfo(key, v, tbl)); }

/* ---------- subida de imágenes (botón, arrastrar, pegar) ---------- */
function wireUpload(inp, btn, file, st, box) {
  var up = async function (fl) {
    if (!fl) return;
    if (!/^image\//.test(fl.type)) { st.textContent = "Error: ese archivo no es una imagen"; return; }
    btn.disabled = true; st.textContent = "Subiendo…";
    try {
      var url = await uploadImage(fl);
      inp.value = url; inp.dispatchEvent(new Event("input", { bubbles: true }));
      st.textContent = "Listo ✓ — recuerda pulsar Guardar";
    } catch (e) { st.textContent = "Error: " + e.message; }
    btn.disabled = false;
  };
  btn.onclick = function () { file.click(); };
  file.onchange = function () { up(file.files[0]); file.value = ""; };
  st.textContent = "o arrastra una imagen aquí, o pega una URL";
  ["dragenter", "dragover"].forEach(function (n) { box.addEventListener(n, function (e) { e.preventDefault(); box.classList.add("drag"); }); });
  ["dragleave", "drop"].forEach(function (n) { box.addEventListener(n, function (e) { e.preventDefault(); box.classList.remove("drag"); }); });
  box.addEventListener("drop", function (e) { up(e.dataTransfer.files[0]); });
  inp.addEventListener("paste", function (e) { var fl = e.clipboardData && e.clipboardData.files && e.clipboardData.files[0]; if (fl) { e.preventDefault(); up(fl); } });
}

/* ---------- selección múltiple ---------- */
function pruneSel() { var pk = (TABLES[cur] || {}).pk || "id", ok = {}; rows.forEach(function (r) { ok[String(r[pk])] = 1; }); Object.keys(SEL).forEach(function (k) { if (!ok[k]) delete SEL[k]; }); }
function syncSel() {
  var n = Object.keys(SEL).length;
  qsa("#view .ck").forEach(function (c) { var on = !!SEL[c.dataset.id]; c.checked = on; var row = c.closest("tr,.gc"); if (row) row.classList.toggle("sel", on); });
  var all = document.querySelector("#view .ck-all");
  if (all) { all.checked = n > 0 && visIds.length > 0 && visIds.every(function (id) { return SEL[id]; }); all.indeterminate = n > 0 && !all.checked && visIds.some(function (id) { return SEL[id]; }); }
  document.body.classList.toggle("has-sel", n > 0);
  $("bn").textContent = n + (n === 1 ? " seleccionada" : " seleccionadas");
}
async function bulkDo(a) {
  var ids = Object.keys(SEL); if (!ids.length) return;
  if (a === "clear") { SEL = {}; syncSel(); return; }
  var tbl = cur, pk = TABLES[tbl].pk || "id";
  if (a === "del") {
    if (!(await confirmBox("Se borrarán " + ids.length + " entradas de la base de datos.", "¿Borrar " + ids.length + (ids.length === 1 ? " entrada?" : " entradas?")))) return;
    var snaps = rows.filter(function (r) { return SEL[String(r[pk])]; }).map(function (r) { var c = Object.assign({}, r); delete c.created_at; return c; });
    var r = await sb.from(tbl).delete().in(pk, ids);
    if (r.error) { if (isAuth(r.error.message)) return expired(); toast("Error: " + r.error.message); return; }
    SEL = {};
    toast(ids.length + " entradas borradas", { label: "Deshacer", fn: async function () {
      var u = await sb.from(tbl).upsert(snaps); toast(u.error ? "Error: " + u.error.message : "Entradas restauradas");
      buildCount(tbl); if (cur === tbl) refresh();
    } });
    await refresh(); syncSel(); buildCount(tbl); return;
  }
  var vis = a === "show", u2 = await sb.from(tbl).update({ visible: vis }).in(pk, ids);
  if (u2.error) { if (isAuth(u2.error.message)) return expired(); toast("Error: " + u2.error.message); return; }
  toast(ids.length + (vis ? " entradas visibles" : " entradas ocultas")); await refresh(); buildCount(tbl);
}
$("bulk").onclick = function (e) { var b = e.target.closest("button[data-b]"); if (b) bulkDo(b.dataset.b); };

/* ---------- arrastrar para reordenar (ratón y táctil) ---------- */
document.addEventListener("pointerdown", function (e) {
  var g = e.target.closest && e.target.closest(".dg"); if (!g || e.button > 0) return;
  var row = g.closest("tr,.gc"); if (!row) return;
  e.preventDefault(); drag = { id: row.dataset.id, row: row, over: null, after: false };
  row.classList.add("dragging"); document.body.classList.add("dragging-now");
  try { g.setPointerCapture(e.pointerId); } catch (x) {}
});
document.addEventListener("pointermove", function (e) {
  if (!drag) return;
  qsa(".drop-a,.drop-b").forEach(function (x) { x.classList.remove("drop-a", "drop-b"); });
  var el = document.elementFromPoint(e.clientX, e.clientY), t = el && el.closest("#view tr[data-id], #view .gc[data-id]");
  if (t && t !== drag.row) {
    var r = t.getBoundingClientRect();
    drag.after = t.classList.contains("gc") ? e.clientX > r.left + r.width / 2 : e.clientY > r.top + r.height / 2;
    drag.over = t; t.classList.add(drag.after ? "drop-a" : "drop-b");
  } else drag.over = null;
  if (e.clientY < 70) window.scrollBy(0, -16); else if (e.clientY > window.innerHeight - 70) window.scrollBy(0, 16);
});
function endDrag(commit) {
  if (!drag) return; var d = drag; drag = null;
  d.row.classList.remove("dragging"); document.body.classList.remove("dragging-now");
  qsa(".drop-a,.drop-b").forEach(function (x) { x.classList.remove("drop-a", "drop-b"); });
  if (commit && d.over) reorderTo(d.id, d.over.dataset.id, d.after);
}
document.addEventListener("pointerup", function () { endDrag(true); });
document.addEventListener("pointercancel", function () { endDrag(false); });
async function reorderTo(id, targetId, after) {
  var tbl = cur, arr = rows.slice(), i = arr.findIndex(function (r) { return String(r.id) === String(id); });
  if (i < 0) return; var item = arr.splice(i, 1)[0], j = arr.findIndex(function (r) { return String(r.id) === String(targetId); });
  if (j < 0) return; arr.splice(after ? j + 1 : j, 0, item);
  var upd = []; arr = arr.map(function (r, n) { if (r.orden === n + 1) return r; var c = Object.assign({}, r, { orden: n + 1 }); upd.push(c); return c; });
  if (!upd.length) return;
  rows = arr; render();
  var r = await sb.from(tbl).upsert(upd);
  if (r.error) { if (isAuth(r.error.message)) return expired(); toast("Error: " + r.error.message); if (cur === tbl) refresh(); } else toast("Orden actualizado");
}

/* ---------- página de configuración con formulario ---------- */
var CFG = [
  { g: "Identidad", f: [
    { k: "nombre_sitio", l: "Nombre del sitio", t: "text", h: "Aparece en la barra superior, el pie de página y la pestaña del navegador." },
    { k: "descripcion", l: "Descripción principal", t: "area", h: "El texto que va debajo del título de la portada." },
    { k: "logo", l: "Logo", t: "img", h: "Mejor cuadrado y de al menos 128 px." },
    { k: "portada", l: "Imagen de portada", t: "img", h: "Fondo de la sección inicial." },
    { k: "libro_icon", l: "Icono de libros", t: "img", h: "Icono que se usa en la biblioteca." } ] },
  { g: "Redes y contacto", f: [
    { k: "whatsapp", l: "WhatsApp (invitación al grupo)", t: "url" }, { k: "instagram", l: "Instagram", t: "url" },
    { k: "youtube", l: "YouTube", t: "url" }, { k: "tiktok", l: "TikTok", t: "url" } ] },
  { g: "Cifras de la portada", f: [
    { k: "miembros_activos", l: "Miembros activos", t: "int", h: "Se muestra como 30+" }, { k: "recursos_compartidos", l: "Recursos compartidos", t: "int" },
    { k: "proyectos_realizados", l: "Proyectos realizados", t: "int" } ] }
];
var cfgOrig = {}, cfgPvT = null;
function cfgFind(k) { var r = null; CFG.forEach(function (g) { g.f.forEach(function (f) { if (f.k === k) r = f; }); }); return r; }
function cfgField(f, v, extra) {
  var id = "c_" + f.k, h = '<div class="fld' + (f.t === "area" || f.t === "img" || extra ? " full" : "") + '"><label for="' + id + '"><span>' + esc(f.l) + "</span>" + (extra || "") + "</label>";
  if (f.t === "area") h += '<textarea id="' + id + '" data-k="' + esc(f.k) + '">' + esc(v) + "</textarea>";
  else h += '<input id="' + id + '" data-k="' + esc(f.k) + '" type="text"' + (f.t === "int" ? ' inputmode="numeric"' : f.t === "url" ? ' inputmode="url" placeholder="https://"' : "") + ' value="' + esc(v) + '">';
  if (f.t === "img") h += '<div class="up"><input type="file" accept="image/*" id="cu_' + f.k + '" hidden><button type="button" class="btn sm" id="cb_' + f.k + '">⬆ Subir imagen</button><span id="cs_' + f.k + '"></span></div><img class="prev" id="cp_' + f.k + '" alt="" src="' + esc(v) + '" style="' + (v ? "" : "display:none") + '">';
  if (f.t === "url") h += '<div class="fh" id="ch_' + f.k + '"></div>';
  if (f.h) h += '<small class="hlp">' + esc(f.h) + "</small>";
  return h + "</div>";
}
function cfgInputs() { return qsa("#view .cfg-form [data-k]"); }
function cfgValues() { var o = {}; Object.keys(cfgOrig).forEach(function (k) { o[k] = cfgOrig[k]; }); cfgInputs().forEach(function (el) { o[el.dataset.k] = el.value.trim(); }); return o; }
function isAdminDoc(f) { var d = null; try { d = f.contentDocument; } catch (e) {} return !!(d && (d.getElementById("login") || (d.getElementById("m-hero-desc") === null && d.getElementById("app")))); }
function renderConfig() {
  cfgOrig = {}; rows.forEach(function (r) { cfgOrig[r.clave] = r.valor == null ? "" : String(r.valor); });
  var known = {}, h = '<div class="cfg"><div class="cfg-form">';
  CFG.forEach(function (g) { h += '<section class="cfgg"><h3>' + g.g + '</h3><div class="fg">'; g.f.forEach(function (f) { known[f.k] = 1; h += cfgField(f, cfgOrig[f.k] || ""); }); h += "</div></section>"; });
  var extra = rows.filter(function (r) { return !known[r.clave]; });
  if (extra.length) {
    h += '<section class="cfgg"><h3>Otros ajustes</h3><div class="fg">';
    extra.forEach(function (r) { h += cfgField({ k: r.clave, l: r.clave, t: "area" }, cfgOrig[r.clave], ib("del", "Borrar ajuste", "M5 7h14M10 11v6M14 11v6M7 7l1 13h8l1-13M9 7V4h6v3", r.clave, "bad")); });
    h += "</div></section>";
  }
  h += '</div><aside class="cfg-pv" id="cfgpvbox"><div class="pvh"><span>Así se verá en la página</span><div class="seg" id="cdev"><button class="on" data-w="100%" style="font-size:13px">Escritorio</button><button data-w="390px" style="font-size:13px">Móvil</button></div></div><div class="pvb"><iframe id="cfgpv" title="Vista previa de la página"></iframe></div><p class="pvn" id="cfgpvn"></p></aside></div>';
  h += '<div class="savebar" id="savebar" role="status"><span>Tienes cambios sin guardar</span><button class="btn" id="cfgpvt" type="button">Vista previa</button><button class="btn" id="cfgdis" type="button">Descartar</button><button class="btn pri" id="cfgsave" type="button">Guardar cambios</button></div>';
  $("view").innerHTML = h; $("sub").textContent = "Ajustes generales de la página"; cfgDirty = false;
  CFG.forEach(function (g) { g.f.forEach(function (f) {
    if (f.t === "img") wireUpload($("c_" + f.k), $("cb_" + f.k), $("cu_" + f.k), $("cs_" + f.k), $("cb_" + f.k).parentNode);
    if (f.t === "url") $("ch_" + f.k).innerHTML = hintHTML(urlInfo(f.k, cfgOrig[f.k], "configuracion"));
  }); });
  document.querySelector("#view .cfg-form").addEventListener("input", function (e) {
    var t = e.target, k = t.dataset && t.dataset.k; if (!k) return; t.classList.remove("inv");
    var f = cfgFind(k);
    if (f && f.t === "url") $("ch_" + k).innerHTML = hintHTML(urlInfo(k, t.value, "configuracion"));
    if (f && f.t === "img") { var pv = $("cp_" + k); pv.src = t.value; pv.style.display = t.value ? "" : "none"; }
    cfgCheck(); clearTimeout(cfgPvT); cfgPvT = setTimeout(cfgSend, 250);
  });
  $("cfgsave").onclick = cfgSave;
  $("cfgdis").onclick = async function () { if (await confirmBox("Se perderán los cambios que no guardaste.", "¿Descartar cambios?", "Descartar")) { cfgDirty = false; renderConfig(); } };
  $("cfgpvt").onclick = function () { var b = $("cfgpvbox"), o = b.classList.toggle("show"); this.textContent = o ? "Ocultar vista" : "Vista previa"; if (o) { cfgLoadPv(); b.scrollIntoView({ block: "nearest", behavior: "smooth" }); } };
  $("cdev").onclick = function (e) { var b = e.target.closest("button"); if (!b) return; qsa("#cdev button").forEach(function (x) { x.classList.toggle("on", x === b); }); $("cfgpv").style.width = b.dataset.w; };
  if (window.innerWidth >= 1180) cfgLoadPv();
}
function cfgLoadPv() {
  var f = $("cfgpv"); if (!f || f.dataset.l) return; f.dataset.l = 1;
  f.onload = function () { if (isAdminDoc(f)) { $("cfgpvn").textContent = "La vista previa cargó el panel en vez de la página: tu index.html contiene el código de admin.html."; return; } cfgSend(); };
  f.src = "index.html?preview=1&t=" + Date.now();
}
function cfgSend() {
  var f = $("cfgpv"); if (!f || !f.contentWindow) return; var v = cfgValues();
  f.contentWindow.postMessage({ type: "nexo-preview", table: "configuracion", section: "inicio", focus: "", rows: Object.keys(v).map(function (k) { return leg("configuracion", { clave: k, valor: v[k] }); }) }, location.origin === "null" ? "*" : location.origin);
}
function cfgCheck() {
  cfgDirty = cfgInputs().some(function (el) { return el.value.trim() !== (cfgOrig[el.dataset.k] || ""); });
  var sb2 = $("savebar"); if (sb2) sb2.classList.toggle("on", cfgDirty);
}
async function cfgSave() {
  var b = $("cfgsave"); if (!b || b.disabled || !cfgDirty) return;
  var ch = [], bad = null;
  cfgInputs().forEach(function (el) {
    var k = el.dataset.k, v = el.value.trim(), o = cfgOrig[k] || "", f = cfgFind(k); if (v === o) return;
    if (f && (f.t === "url" || f.t === "img") && v) { var i = urlInfo(k, v, "configuracion"); if (i && i.lv === "err" && !bad) bad = [el, f.l + ": " + i.msg]; }
    if (f && f.t === "int" && v && !/^\d+$/.test(v) && !bad) bad = [el, f.l + ": usa solo números"];
    if (v === "" && !(k in cfgOrig)) return;
    ch.push({ clave: k, valor: v === "" ? null : v });
  });
  if (bad) { bad[0].classList.add("inv"); bad[0].focus(); toast("Error: " + bad[1]); return; }
  if (!ch.length) { cfgCheck(); return; }
  b.disabled = true; b.textContent = "Guardando…";
  var r = await sb.from("configuracion").upsert(ch);
  b.disabled = false; b.textContent = "Guardar cambios";
  if (r.error) { if (isAuth(r.error.message)) return expired(); toast("Error: " + r.error.message); return; }
  cfgDirty = false; try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf("nexo-sb::") === 0) localStorage.removeItem(k); }); } catch (e) {}
  toast("Ajustes guardados"); await refresh(); buildCount("configuracion");
}
boot();
