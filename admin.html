<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Panel Admin — Nexo Artístico</title>
<link rel="icon" type="image/png" href="https://res.cloudinary.com/ojp6mrxi/image/upload/f_auto,q_auto/NXA_LOGO" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0c0a1e;--s1:#13112b;--s2:#1b1840;--line:#2a2660;--txt:#ece9ff;--mut:#9a95c9;--pri:#8b6cff;--pri2:#b3a0ff;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h3,b{font-family:Sora,Inter,sans-serif;font-weight:600}h1,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri2);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:8px 14px;text-decoration:none;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--pri2)}.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}.btn.pri:hover{background:#7a58f5}
.btn.ghost{background:transparent}.btn.sm{padding:5px 10px;font-size:13px}.btn.icon{padding:7px 10px}.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--pri2);box-shadow:0 0 0 3px #8b6cff2e}
textarea{min-height:96px;resize:vertical}label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 50% -10%,#3a1f8c55,transparent)}
.card{width:100%;max-width:380px;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:30px}
.card img{width:44px;height:44px;border-radius:12px;margin-bottom:16px}.card h1{font-size:22px}.card p{color:var(--mut);margin:6px 0 4px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
/* shell */
#app{display:none;grid-template-columns:252px 1fr;min-height:100vh}
aside{background:var(--s1);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;gap:11px;align-items:center;padding:2px 8px 18px}.brand img{width:36px;height:36px;border-radius:10px}
.brand b{display:block;font-size:15px;line-height:1.2}.brand span{font-size:12px;color:var(--mut)}
#nav{flex:1}.grp{font-size:12px;color:var(--mut);padding:16px 10px 6px;opacity:.8}
.nv{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;border-radius:9px;padding:8px 10px;color:var(--mut);text-align:left}
.nv:hover{background:var(--s2);color:var(--txt)}.nv.on{background:#8b6cff24;color:#fff;box-shadow:inset 2px 0 0 var(--pri)}
.nv span{flex:1}.nv i{font-style:normal;font-size:12px;color:var(--mut);min-width:18px;text-align:right}
.sfoot{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.me{display:flex;align-items:center;gap:8px;justify-content:space-between}.me span{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:26px 30px;min-width:0}
.top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.ttl{margin-right:auto}.ttl h1{font-size:24px;letter-spacing:-.01em}.ttl p{color:var(--mut);margin-top:2px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tools input{width:230px}body.is-home .tools{display:none}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg button{background:none;border:0;padding:8px 11px;color:var(--mut);display:flex}
.seg button.on{background:var(--s2);color:#fff}.mob{display:none}
/* tabla */
.tw{background:var(--s1);border:1px solid var(--line);border-radius:14px;overflow:auto}
table{border-collapse:collapse;width:100%}th,td{padding:10px 14px;text-align:left;border-bottom:1px solid #221f52;vertical-align:middle}
th{font-size:13px;font-weight:500;color:var(--mut);background:var(--s1);position:sticky;top:0;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}tbody tr:hover td{background:#17143a}tr.hid td{opacity:.5}
td.t{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}td.ttl2{color:var(--txt);font-weight:500}
td img{width:46px;height:46px;object-fit:cover;border-radius:9px;display:block;background:var(--s2)}
.act{display:flex;gap:4px;justify-content:flex-end;white-space:nowrap}
.ib{width:32px;height:32px;display:grid;place-items:center;background:none;border:1px solid transparent;border-radius:8px;color:var(--mut)}
.ib:hover{background:var(--s2);color:var(--txt)}.ib.bad:hover{color:var(--bad);border-color:#fb718555}
.sw{width:34px;height:20px;border-radius:99px;background:#2a2660;border:0;position:relative;padding:0;transition:background .15s}
.sw i{position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#cfcaff;transition:transform .15s}
.sw.on{background:var(--ok)}.sw.on i{transform:translateX(14px);background:#06281c}
.bd{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--s2);border:1px solid var(--line);color:var(--mut)}
.bd.activo{color:var(--ok);border-color:#34d39955}.bd.pendiente{color:var(--warn);border-color:#fbbf2455}.bd.finalizado{color:var(--pri2);border-color:#8b6cff55}
.empty{padding:70px 20px;text-align:center;color:var(--mut)}.empty b{display:block;color:var(--txt);font-size:17px;margin-bottom:4px}
.sk{height:62px;border-bottom:1px solid #221f52;background:linear-gradient(90deg,transparent,#8b6cff14,transparent) 0 0/200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}@media(prefers-reduced-motion:reduce){.sk{animation:none}*{transition:none!important}}
/* galería */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.gc{background:var(--s1);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.gc.hid{opacity:.55}
.gi{aspect-ratio:4/3;background:var(--s2);display:grid;place-items:center;color:var(--mut);font-size:13px}.gi img{width:100%;height:100%;object-fit:cover;display:block}
.gb{padding:12px 14px 4px}.gb b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gb small{color:var(--mut)}
.gf{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 10px 14px}
/* resumen */
.home{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.hc{text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:4px}
.hc:hover{border-color:var(--pri2);background:var(--s2)}.hi{width:40px;height:40px;border-radius:11px;background:#8b6cff24;color:var(--pri2);display:grid;place-items:center;margin-bottom:10px}
.hc b{font-size:15px}.hc em{font-style:normal;color:var(--mut)}
/* diálogos */
dialog{background:var(--s1);color:var(--txt);border:1px solid var(--line);border-radius:18px;padding:0;width:min(580px,94vw);max-height:90vh;box-shadow:0 30px 80px #000a}
dialog::backdrop{background:#05030fcc;backdrop-filter:blur(3px)}#cdlg{width:min(400px,92vw)}
.mh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.mh h3{font-size:17px}
.mb{padding:2px 22px 10px;overflow:auto;max-height:62vh}.mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.chk{display:flex;align-items:center;gap:9px;margin-top:16px}.chk input{width:auto}
.up{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:13px;color:var(--mut)}.prev{margin-top:10px;max-height:120px;border-radius:10px;border:1px solid var(--line)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--ok);padding:10px 18px;border-radius:11px;display:none;z-index:99;box-shadow:0 10px 30px #0008}#toast.bad{border-color:var(--bad)}
#scrim{display:none}
@media(max-width:900px){#app{grid-template-columns:1fr}aside{position:fixed;inset:0 auto 0 0;width:270px;z-index:30;transform:translateX(-100%);transition:transform .2s}
body.nav-open aside{transform:none}body.nav-open #scrim{display:block;position:fixed;inset:0;background:#000a;z-index:20}.mob{display:inline-flex}main{padding:16px}.tools input{width:100%;flex:1}.top{gap:12px}}
#dlg{width:min(1240px,96vw)}.split{display:grid;grid-template-columns:minmax(0,500px) minmax(0,1fr)}
.pv{border-left:1px solid var(--line);background:var(--s2);display:flex;flex-direction:column;min-width:0}
.pvh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;font-weight:500}
.pvb{flex:1;display:flex;justify-content:center;padding:0 16px;min-height:0;height:calc(62vh + 20px)}
#pvf{width:100%;height:100%;border:1px solid var(--line);border-radius:10px;background:#05030f;transition:width .2s}
.pvn{margin:0;padding:10px 16px;color:var(--warn);font-size:13px;min-height:38px}
@media(max-width:900px){.split{grid-template-columns:1fr}.pv{border-left:0;border-top:1px solid var(--line)}.pvb{height:420px}}
</style>
</head>
<body>

<section id="login">
  <div class="card">
    <img src="https://res.cloudinary.com/ojp6mrxi/image/upload/f_auto,q_auto/NXA_LOGO" alt="">
    <h1>Panel del Nexo</h1>
    <p>Inicia sesión para editar el contenido de la página.</p>
    <label for="email">Correo</label><input id="email" type="email" autocomplete="username" />
    <label for="pass">Contraseña</label><input id="pass" type="password" autocomplete="current-password" />
    <div class="err" id="lerr"></div>
    <button class="btn pri" id="go" style="width:100%;margin-top:6px">Iniciar sesión</button>
  </div>
</section>

<div id="app">
  <aside>
    <div class="brand"><img src="https://res.cloudinary.com/ojp6mrxi/image/upload/f_auto,q_auto/NXA_LOGO" alt=""><div><b>Nexo Artístico</b><span>Panel de administración</span></div></div>
    <nav id="nav"></nav>
    <div class="sfoot">
      <a class="btn ghost" href="index.html" target="_blank" rel="noopener">Ver la página</a>
      <div class="me"><span id="who"></span><button class="btn ghost sm" id="out">Salir</button></div>
    </div>
  </aside>
  <div id="scrim"></div>
  <main>
    <header class="top">
      <button class="btn icon mob" id="burger" aria-label="Abrir menú">☰</button>
      <div class="ttl"><h1 id="title"></h1><p id="sub"></p></div>
      <div class="tools">
        <input id="q" type="search" placeholder="Buscar en esta sección" aria-label="Buscar" />
        <div class="seg" id="seg">
          <button data-v="t" class="on" aria-label="Ver como tabla" title="Tabla"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          <button data-v="g" aria-label="Ver como galería" title="Galería"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg></button>
        </div>
        <button class="btn pri" id="add">Añadir entrada</button>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>

<dialog id="cdlg">
  <div class="mb" style="padding:22px"><h3>¿Borrar esta entrada?</h3><p id="cm" style="color:var(--mut);margin-top:8px"></p></div>
  <div class="mf"><button class="btn" id="cno">Cancelar</button><button class="btn pri" id="cok" style="background:var(--bad);border-color:var(--bad)">Borrar</button></div>
</dialog>

<dialog id="dlg">
  <div class="mh"><h3 id="dt"></h3><button class="btn sm" id="dx">✕</button></div>
  <div class="split">
    <div><div class="mb" id="form"></div><div class="err" id="ferr" style="padding:0 22px"></div></div>
    <div class="pv">
      <div class="pvh"><span>Así se verá en la página</span><div class="seg" id="dev"><button class="on" data-w="100%" style="font-size:13px">Escritorio</button><button data-w="390px" style="font-size:13px">Móvil</button></div></div>
      <div class="pvb"><iframe id="pvf" title="Vista previa de la página"></iframe></div>
      <p class="pvn" id="pvn"></p>
    </div>
  </div>
  <div class="mf"><button class="btn" id="dc">Cancelar</button><button class="btn pri" id="ds">Guardar cambios</button></div>
</dialog>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script>
"use strict";
/* ---------- Definición de las tablas editables (misma estructura que el esquema SQL) ---------- */
var VIS = { k: "visible", l: "Visible en la página", t: "bool" }, ORD = { k: "orden", l: "Orden", t: "int" };
var TABLES = {
  configuracion: { label: "Configuración", pk: "clave", kv: true, cols: ["clave", "valor"],
    fields: [{ k: "clave", l: "Clave", t: "text", req: 1 }, { k: "valor", l: "Valor", t: "area" }] },
  obras: { label: "Obras destacadas", prefix: "Obra-", pad: 4, cols: ["imagen", "titulo", "autor", "etiquetas", "orden", "visible"],
    fields: [{ k: "titulo", l: "Título", t: "text", req: 1 }, { k: "autor", l: "Autor", t: "text" }, { k: "imagen", l: "Imagen (URL)", t: "img" }, { k: "etiquetas", l: "Etiquetas", t: "text" }, ORD, VIS] },
  proyectos: { label: "Proyectos", prefix: "proy-", pad: 4, cols: ["titulo", "categoria", "estado", "fecha_inicio", "participantes", "orden", "visible"],
    fields: [{ k: "titulo", l: "Título", t: "text", req: 1 }, { k: "descripcion", l: "Descripción", t: "area" },
      { k: "categoria", l: "Categoría", t: "sel", o: ["Torneo", "LNxA", "Dinamica", "Colaboracion", "Inktober"], free: 1 },
      { k: "estado", l: "Estado", t: "sel", o: ["activo", "pendiente", "finalizado"] },
      { k: "fecha_inicio", l: "Fecha de inicio", t: "date" }, { k: "fecha_final", l: "Fecha final", t: "date" },
      { k: "participantes", l: "Participantes", t: "int" }, { k: "obras", l: "Obras", t: "int" }, { k: "ganadores", l: "Ganadores", t: "int" },
      { k: "enlace", l: "Enlace del resultado (YouTube/TikTok)", t: "text" }, ORD, VIS] },
  libros: { label: "Libros", prefix: "L", pad: 5, cols: ["titulo", "autores", "idioma", "orden", "visible"],
    fields: [{ k: "titulo", l: "Título", t: "text", req: 1 }, { k: "autores", l: "Autor(es)", t: "text" }, { k: "idioma", l: "Idioma", t: "text" }, { k: "enlace", l: "Enlace de descarga", t: "text" }, { k: "nueva_pestana", l: "Abrir en pestaña nueva", t: "bool" }, ORD, VIS] },
  recursos: { label: "Recursos", prefix: "R", pad: 5, cols: ["imagen", "titulo", "tipo", "categoria", "orden", "visible"],
    fields: [{ k: "titulo", l: "Título", t: "text", req: 1 }, { k: "tipo", l: "Tipo", t: "text" }, { k: "categoria", l: "Categoría", t: "sel", o: ["Recursos", "Software"], free: 1 }, { k: "descripcion", l: "Descripción", t: "area" }, { k: "imagen", l: "Imagen (URL)", t: "img" }, { k: "enlace", l: "Enlace", t: "text" }, { k: "etiquetas", l: "Etiquetas", t: "text" }, ORD, VIS] },
  pines: { label: "Tableros de Pinterest", prefix: "P", pad: 5, cols: ["portada", "titulo", "cantidad_pines", "orden", "visible"],
    fields: [{ k: "titulo", l: "Título", t: "text", req: 1 }, { k: "descripcion", l: "Descripción", t: "area" }, { k: "portada", l: "Portada (URL)", t: "img" }, { k: "mini_1", l: "Miniatura 1 (URL)", t: "img" }, { k: "mini_2", l: "Miniatura 2 (URL)", t: "img" }, { k: "enlace", l: "Enlace al tablero", t: "text" }, { k: "cantidad_pines", l: "Cantidad de pines (ej. 100+)", t: "text" }, ORD, VIS] },
  videos: { label: "Videos", prefix: "V", pad: 4, cols: ["titulo", "autor", "categoria", "orden", "visible"],
    fields: [{ k: "titulo", l: "Título", t: "text", req: 1 }, { k: "autor", l: "Autor", t: "text" }, { k: "categoria", l: "Categoría", t: "text" }, { k: "youtube_url", l: "Enlace (YouTube o TikTok)", t: "text" }, ORD, VIS] },
  playlists: { label: "Playlists", prefix: "PL", pad: 4, cols: ["imagen", "titulo", "autor", "nivel", "orden", "visible"],
    fields: [{ k: "titulo", l: "Título", t: "text", req: 1 }, { k: "autor", l: "Autor", t: "text" }, { k: "descripcion", l: "Descripción", t: "area" }, { k: "nivel", l: "Nivel", t: "sel", o: ["Principiantes", "Intermedio", "Avanzado"], free: 1 }, { k: "imagen", l: "Imagen (URL)", t: "img" }, ORD, VIS] },
  playlist_videos: { label: "Videos de playlists", prefix: "PV", pad: 5, cols: ["playlist_id", "titulo", "orden", "visible"],
    fields: [{ k: "playlist_id", l: "Playlist", t: "ref", ref: "playlists", req: 1 }, { k: "titulo", l: "Título", t: "text", req: 1 }, { k: "youtube_url", l: "Enlace de YouTube", t: "text" }, ORD, VIS] },
  equipo: { label: "Equipo", prefix: "EQ", pad: 4, cols: ["imagen", "nombre", "rol", "orden", "visible"],
    fields: [{ k: "nombre", l: "Nombre", t: "text", req: 1 }, { k: "rol", l: "Rol", t: "text" }, { k: "descripcion", l: "Descripción", t: "area" }, { k: "imagen", l: "Imagen (URL)", t: "img" }, { k: "contribuciones", l: "Contribuciones", t: "area" }, ORD, VIS] },
  testimonios: { label: "Testimonios", prefix: "T", pad: 4, cols: ["nombre", "rol", "texto", "orden", "visible"],
    fields: [{ k: "nombre", l: "Nombre", t: "text", req: 1 }, { k: "rol", l: "Rol", t: "text" }, { k: "texto", l: "Testimonio", t: "area", req: 1 }, ORD, VIS] },
  sobre: { label: "Sobre nosotros", prefix: "S", pad: 3, cols: ["tipo", "titulo", "descripcion", "orden", "visible"],
    fields: [{ k: "tipo", l: "Tipo", t: "sel", o: ["Historia", "Mision", "Vision", "Valor", "Unico"], req: 1 }, { k: "titulo", l: "Título", t: "text", req: 1 }, { k: "descripcion", l: "Descripción", t: "area" }, { k: "icono", l: "Icono (opcional)", t: "text" }, ORD, VIS] }
};
var KEYS = Object.keys(TABLES);

var $ = function (id) { return document.getElementById(id); };
function esc(v) { return (v == null ? "" : String(v)).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function toast(m) { var t = $("toast"); t.textContent = m; t.className = /^Error/.test(m) ? "bad" : ""; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(function () { t.style.display = "none"; }, 2400); }

var cfg = window.NEXO_SUPABASE || {};
if (!cfg.url || !cfg.anonKey) {
  $("lerr").textContent = "Falta configurar js/supabase-config.js (url y anonKey).";
  $("go").disabled = true;
}
var sb = (cfg.url && cfg.anonKey) ? window.supabase.createClient(cfg.url, cfg.anonKey) : null;
var cur = "home", rows = [], counts = {}, editing = null, refCache = {};

/* ---------- sesión ---------- */
async function boot() {
  if (!sb) return;
  var s = (await sb.auth.getSession()).data.session;
  if (!s) return showLogin();
  var a = await sb.from("admins").select("user_id").eq("user_id", s.user.id).maybeSingle();
  if (a.error || !a.data) {
    await sb.auth.signOut(); showLogin();
    $("lerr").textContent = "Esta cuenta no tiene permisos de administrador.";
    return;
  }
  $("who").textContent = s.user.email;
  $("login").style.display = "none"; $("app").style.display = "grid";
  buildNav(); load(cur);
}
function showLogin() { $("login").style.display = "grid"; $("app").style.display = "none"; }
$("go").onclick = async function () {
  $("lerr").textContent = "";
  var r = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pass").value });
  if (r.error) { $("lerr").textContent = "Correo o contraseña incorrectos."; return; }
  boot();
};
$("pass").onkeydown = function (e) { if (e.key === "Enter") $("go").click(); };
$("out").onclick = async function () { await sb.auth.signOut(); location.reload(); };

/* ---------- navegación + listado ---------- */
var GROUPS = [["Página", ["configuracion", "sobre", "equipo", "testimonios"]], ["Contenido", ["obras", "proyectos"]], ["Biblioteca", ["libros", "recursos", "pines"]], ["Aprendizaje", ["videos", "playlists", "playlist_videos"]]];
var IC = { home: "M3 11l9-8 9 8M5 10v10h14V10", configuracion: "M4 6h9m4 0h3M4 12h3m4 0h9M4 18h11m4 0h1", sobre: "M12 8h.01M11 12h1v5h1M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z", equipo: "M16 20v-1a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v1M10 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM20 20v-1a3 3 0 0 0-2-2.8", testimonios: "M5 5h6v6a5 5 0 0 1-5 5M14 5h6v6a5 5 0 0 1-5 5", obras: "M4 5h16v14H4zM4 15l5-5 4 4 3-3 4 4M9 9h.01", proyectos: "M5 21V4M5 4h11l-2 4 2 4H5", libros: "M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h10", recursos: "M4 8l8-4 8 4v8l-8 4-8-4zM4 8l8 4 8-4M12 12v8", pines: "M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10zM12 11h.01", videos: "M4 5h16v14H4zM10 9l5 3-5 3z", playlists: "M4 6h12M4 12h12M4 18h8M18 15v5l4-2.5z", playlist_videos: "M4 4h16v16H4zM8 4v16M16 4v16M4 9h4M16 9h4M4 15h4M16 15h4" };
function ico(k, s) { return '<svg width="' + (s || 18) + '" height="' + (s || 18) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="' + IC[k] + '"/></svg>'; }
var VIEW = "t", loading = false;
try { VIEW = localStorage.getItem("nexo-admin-view") || "t"; } catch (e) {}
function imgField(T) { return T.fields.filter(function (f) { return f.t === "img"; })[0]; }
function titleOf(r) { return r.titulo || r.nombre || r.clave || r.id; }
function qsa(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
function buildNav() {
  var h = '<button data-k="home" class="nv">' + ico("home") + "<span>Resumen</span></button>";
  GROUPS.forEach(function (g) {
    h += '<div class="grp">' + g[0] + "</div>";
    g[1].forEach(function (k) { h += '<button data-k="' + k + '" class="nv">' + ico(k) + "<span>" + TABLES[k].label + '</span><i id="n-' + k + '"></i></button>'; });
  });
  $("nav").innerHTML = h;
  $("nav").onclick = function (e) { var b = e.target.closest("button"); if (b) { cur = b.dataset.k; $("q").value = ""; document.body.classList.remove("nav-open"); load(cur); } };
  KEYS.forEach(async function (k) {
    var r = await sb.from(k).select("*", { count: "exact", head: true });
    if (!r.error) { counts[k] = r.count; var n = $("n-" + k); if (n) n.textContent = r.count; if (cur === "home") renderHome(); }
  });
}
async function load(k) {
  qsa("#nav .nv").forEach(function (b) { b.classList.toggle("on", b.dataset.k === k); });
  document.body.classList.toggle("is-home", k === "home");
  if (k === "home") { $("title").textContent = "Resumen"; $("sub").textContent = "Elige qué parte de la página quieres editar."; renderHome(); return; }
  var T = TABLES[k];
  $("title").textContent = T.label; $("sub").textContent = "Cargando…"; $("seg").style.display = imgField(T) ? "" : "none";
  loading = true; rows = []; render();
  var q = sb.from(k).select("*");
  q = T.kv ? q.order("clave") : q.order("orden", { ascending: true, nullsFirst: false }).order("id", { ascending: true });
  var r = await q; loading = false;
  if (r.error) { toast("Error: " + r.error.message); rows = []; } else rows = r.data;
  render();
}
function renderHome() {
  $("view").innerHTML = '<div class="home">' + KEYS.map(function (k) {
    var n = counts[k];
    return '<button class="hc" data-k="' + k + '"><span class="hi">' + ico(k, 22) + "</span><b>" + TABLES[k].label + "</b><em>" + (n == null ? "…" : n + (n === 1 ? " entrada" : " entradas")) + "</em></button>";
  }).join("") + "</div>";
}
function ib(a, t, p, id, c) { return '<button class="ib ' + (c || "") + '" data-a="' + a + '" data-id="' + esc(id) + '" title="' + t + '" aria-label="' + t + '"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="' + p + '"/></svg></button>'; }
function acts(id, mv) { return (mv ? ib("up", "Subir", "M6 15l6-6 6 6", id) + ib("dn", "Bajar", "M6 9l6 6 6-6", id) : "") + ib("edit", "Editar", "M4 20h4L19 9l-4-4L4 16zM13 7l4 4", id) + ib("del", "Borrar", "M5 7h14M10 11v6M14 11v6M7 7l1 13h8l1-13M9 7V4h6v3", id, "bad"); }
function sw(r, id) { return '<button class="sw' + (r.visible ? " on" : "") + '" role="switch" aria-checked="' + !!r.visible + '" data-a="vis" data-id="' + esc(id) + '" title="' + (r.visible ? "Visible. Pulsa para ocultar" : "Oculto. Pulsa para mostrar") + '"><i></i></button>'; }
function render() {
  var T = TABLES[cur], pk = T.pk || "id", term = $("q").value.toLowerCase(), imf = imgField(T);
  var list = rows.filter(function (r) { return !term || JSON.stringify(r).toLowerCase().indexOf(term) > -1; });
  var hid = rows.filter(function (r) { return r.visible === false; }).length;
  if (!loading) $("sub").textContent = rows.length + (rows.length === 1 ? " entrada" : " entradas") + (hid ? ", " + hid + (hid === 1 ? " oculta" : " ocultas") : "");
  qsa("#seg button").forEach(function (b) { b.classList.toggle("on", b.dataset.v === VIEW); });
  if (loading) { $("view").innerHTML = '<div class="tw">' + new Array(7).join('<div class="sk"></div>') + "</div>"; return; }
  if (!list.length) { $("view").innerHTML = '<div class="empty"><b>' + (rows.length ? "Sin resultados" : "Aún no hay nada aquí") + "</b>" + (rows.length ? "Prueba con otra búsqueda." : "Añade la primera entrada con el botón de arriba.") + "</div>"; return; }
  var mv = !T.kv && !term;
  if (VIEW === "g" && imf) {
    $("view").innerHTML = '<div class="gal">' + list.map(function (r) {
      var id = r[pk];
      return '<article class="gc' + (r.visible === false ? " hid" : "") + '"><div class="gi">' + (r[imf.k] ? '<img loading="lazy" src="' + esc(r[imf.k]) + '" alt="">' : "Sin imagen") + '</div><div class="gb"><b>' + esc(titleOf(r)) + "</b><small>" + esc(r.autor || r.rol || r.tipo || r.categoria || "") + '</small></div><div class="gf">' + sw(r, id) + '<div class="act">' + acts(id, mv) + "</div></div></article>";
    }).join("") + "</div>";
    return;
  }
  var head = T.cols.map(function (c) { return "<th>" + (c === "visible" ? "Visible" : c === "orden" ? "Orden" : c.charAt(0).toUpperCase() + c.slice(1).replace(/_/g, " ")) + "</th>"; }).join("") + "<th></th>";
  $("view").innerHTML = '<div class="tw"><table><thead><tr>' + head + "</tr></thead><tbody>" + list.map(function (r) {
    var id = r[pk];
    var tds = T.cols.map(function (c) {
      var v = r[c];
      if (c === "visible") return "<td>" + sw(r, id) + "</td>";
      if (c === "imagen" || c === "portada") return "<td>" + (v ? '<img loading="lazy" src="' + esc(v) + '" alt="">' : "") + "</td>";
      if (c === "estado" && v) return '<td><span class="bd ' + esc(v) + '">' + esc(v) + "</span></td>";
      return '<td class="t' + (c === "titulo" || c === "nombre" || c === "clave" ? " ttl2" : "") + '">' + esc(v == null ? "" : v) + "</td>";
    }).join("");
    return '<tr class="' + (r.visible === false ? "hid" : "") + '">' + tds + '<td><div class="act">' + acts(id, mv) + "</div></td></tr>";
  }).join("") + "</tbody></table></div>";
}
$("q").oninput = render;
$("seg").onclick = function (e) { var b = e.target.closest("button"); if (b) { VIEW = b.dataset.v; try { localStorage.setItem("nexo-admin-view", VIEW); } catch (x) {} render(); } };
$("burger").onclick = function () { document.body.classList.add("nav-open"); };
$("scrim").onclick = function () { document.body.classList.remove("nav-open"); };
function confirmBox(msg) {
  return new Promise(function (res) {
    var d = $("cdlg"); $("cm").textContent = msg; d.showModal();
    $("cok").onclick = function () { d.close(); res(true); };
    $("cno").onclick = function () { d.close(); res(false); };
    d.oncancel = function () { res(false); };
  });
}
$("view").onclick = async function (e) {
  var hc = e.target.closest(".hc"); if (hc) { cur = hc.dataset.k; load(cur); return; }
  var b = e.target.closest("button[data-a]"); if (!b) return;
  var T = TABLES[cur], pk = T.pk || "id", id = b.dataset.id, row = rows.filter(function (r) { return String(r[pk]) === id; })[0];
  if (b.dataset.a === "edit") openForm(row);
  if (b.dataset.a === "del") {
    if (await confirmBox("“" + titleOf(row) + "” se borrará de la base de datos. Esta acción no se puede deshacer.")) {
      var r = await sb.from(cur).delete().eq(pk, id); toast(r.error ? "Error: " + r.error.message : "Entrada borrada"); load(cur); buildCount(cur);
    }
  }
  if (b.dataset.a === "vis") { var r2 = await sb.from(cur).update({ visible: !row.visible }).eq(pk, id); toast(r2.error ? "Error: " + r2.error.message : (row.visible ? "Entrada oculta" : "Entrada visible")); load(cur); }
  if (b.dataset.a === "up" || b.dataset.a === "dn") move(id, b.dataset.a === "up" ? -1 : 1);
};
async function buildCount(k) { var r = await sb.from(k).select("*", { count: "exact", head: true }); if (!r.error) { counts[k] = r.count; var n = $("n-" + k); if (n) n.textContent = r.count; } }
async function move(id, dir) {
  var i = rows.findIndex(function (r) { return r.id === id; }), j = i + dir;
  if (j < 0 || j >= rows.length) return;
  var arr = rows.slice(), t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  var upd = [];
  arr.forEach(function (r, n) { if (r.orden !== n + 1) upd.push(Object.assign({}, r, { orden: n + 1 })); });
  var r = await sb.from(cur).upsert(upd);
  if (r.error) toast("Error: " + r.error.message); else load(cur);
}

/* ---------- vista previa ---------- */
var PVMAP = { configuracion: "inicio", obras: "obras", proyectos: "proyectos", libros: "biblioteca", recursos: "biblioteca", pines: "biblioteca", videos: "centro-de-mejora", playlists: "centro-de-mejora", playlist_videos: "centro-de-mejora", sobre: "sobre-el-nexo", equipo: "sobre-el-nexo", testimonios: "sobre-el-nexo" };
var LEG = { libros: { autores: "autor(es)", nueva_pestana: "nueva_pestaña" }, proyectos: { fecha_final: "Fecha_final" } }, pvT;
function leg(t, r) {
  var m = LEG[t] || {}, o = {};
  Object.keys(r).forEach(function (k) { if (k === "created_at") return; var v = r[k]; o[m[k] || k] = v == null ? "" : (typeof v === "boolean" ? (v ? "TRUE" : "FALSE") : String(v)); });
  return o;
}
function draft() {
  var T = TABLES[cur], o = {};
  T.fields.forEach(function (f) {
    var el = $("f_" + f.k); if (!el) return; var v;
    if (f.t === "bool") v = el.checked; else { v = el.value.trim(); if (f.t === "int") v = v === "" ? null : parseInt(v, 10); else if (v === "") v = null; }
    o[f.k] = v;
  });
  var pk = T.pk || "id";
  if (editing) o[pk] = editing[pk]; else if (T.kv) o.clave = o.clave || "nueva_clave"; else o.id = "__nuevo";
  if (!T.kv) o.visible = true;
  return o;
}
function pvSend() {
  var T = TABLES[cur], d = draft(), pk = T.pk || "id", hit = false, f = $("pvf"), vis = $("f_visible");
  $("pvn").textContent = vis && !vis.checked ? "Esta entrada está oculta: aquí se muestra, pero no aparecerá en la página." : "";
  var list = rows.filter(function (r) { return T.kv || r.visible || String(r[pk]) === String(d[pk]); }).map(function (r) {
    if (String(r[pk]) === String(d[pk])) { hit = true; return Object.assign({}, r, d); } return r;
  });
  if (!hit) list.push(d);
  if (f.contentWindow) f.contentWindow.postMessage({ type: "nexo-preview", table: cur, section: PVMAP[cur], focus: d.titulo || d.nombre || d.clave || "", rows: list.map(function (r) { return leg(cur, r); }) }, location.origin === "null" ? "*" : location.origin);
}
function pvInit() {
  var f = $("pvf"); f.onload = pvSend; f.src = "index.html?preview=1&t=" + Date.now();
  $("form").oninput = $("form").onchange = function () { clearTimeout(pvT); pvT = setTimeout(pvSend, 350); };
}
$("dev").onclick = function (e) { var b = e.target.closest("button"); if (!b) return; qsa("#dev button").forEach(function (x) { x.classList.toggle("on", x === b); }); $("pvf").style.width = b.dataset.w; };
$("dlg").addEventListener("close", function () { var f = $("pvf"); f.onload = null; f.src = "about:blank"; });

/* ---------- formulario ---------- */
async function openForm(row) {
  var T = TABLES[cur]; editing = row || null;
  $("dt").textContent = (row ? "Editar entrada" : "Añadir entrada") + " en " + T.label.toLowerCase(); $("ferr").textContent = "";
  var html = "";
  for (var i = 0; i < T.fields.length; i++) {
    var f = T.fields[i], v = row ? row[f.k] : (f.k === "visible" || f.k === "nueva_pestana" ? true : f.k === "orden" ? (rows.length + 1) : "");
    if (v == null) v = "";
    var id = "f_" + f.k, lab = "<label>" + f.l + (f.req ? " *" : "") + "</label>";
    if (f.t === "bool") html += '<div class="chk"><input type="checkbox" id="' + id + '"' + (v === true ? " checked" : "") + '><span>' + f.l + "</span></div>";
    else if (f.t === "area") html += lab + '<textarea id="' + id + '">' + esc(v) + "</textarea>";
    else if (f.t === "sel" || f.t === "ref") {
      var opts = f.o || [];
      if (f.t === "ref") { var rr = await sb.from(f.ref).select("id,titulo").order("orden"); opts = (rr.data || []).map(function (x) { return [x.id, x.id + " — " + x.titulo]; }); }
      var has = opts.some(function (o) { return (Array.isArray(o) ? o[0] : o) === v; });
      if (v && !has && f.t === "sel") opts = opts.concat([v]);
      html += lab + '<select id="' + id + '"><option value="">—</option>' + opts.map(function (o) { var val = Array.isArray(o) ? o[0] : o, tx = Array.isArray(o) ? o[1] : o; return '<option value="' + esc(val) + '"' + (val === v ? " selected" : "") + ">" + esc(tx) + "</option>"; }).join("") + "</select>";
    } else html += lab + '<input id="' + id + '" type="' + (f.t === "int" ? "number" : f.t === "date" ? "date" : "text") + '" value="' + esc(v) + '">' + (f.t === "img" ? '<div class="up"><input type="file" accept="image/*" id="u_' + f.k + '" hidden><button type="button" class="btn sm" id="ub_' + f.k + '">⬆ Subir imagen</button><span id="us_' + f.k + '">o pega una URL arriba</span></div><img class="prev" id="p_' + f.k + '" src="' + esc(v) + '" style="' + (v ? "" : "display:none") + '">' : "");
  }
  $("form").innerHTML = html;
  T.fields.forEach(function (f) { if (f.t === "img") $("f_" + f.k).oninput = function () { var p = $("p_" + f.k); p.src = this.value; p.style.display = this.value ? "" : "none"; }; });
  T.fields.forEach(function (f) {
    if (f.t !== "img") return;
    var file = $("u_" + f.k), btn = $("ub_" + f.k), st = $("us_" + f.k);
    btn.onclick = function () { file.click(); };
    file.onchange = async function () {
      if (!file.files[0]) return;
      btn.disabled = true; st.textContent = "Subiendo…";
      try {
        var url = await uploadImage(file.files[0]);
        var inp = $("f_" + f.k); inp.value = url; inp.dispatchEvent(new Event("input"));
        st.textContent = "Listo ✓ — recuerda pulsar Guardar";
      } catch (e) { st.textContent = "Error: " + e.message; }
      btn.disabled = false; file.value = "";
    };
  });
  if (T.kv && row) $("f_clave").disabled = true;
  $("dlg").showModal(); pvInit();
}
async function uploadImage(file) {
  var c = cfg.cloudinary || {};
  if (!c.cloudName || !c.uploadPreset) throw new Error("falta cloudinary.uploadPreset en js/supabase-config.js");
  if (file.size > 10 * 1024 * 1024) throw new Error("la imagen pesa más de 10 MB");
  var fd = new FormData(); fd.append("file", file); fd.append("upload_preset", c.uploadPreset);
  var r = await fetch("https://api.cloudinary.com/v1_1/" + c.cloudName + "/image/upload", { method: "POST", body: fd });
  var j = await r.json();
  if (!r.ok || !j.secure_url) throw new Error((j.error && j.error.message) || "no se pudo subir");
  return j.secure_url.replace("/upload/", "/upload/f_auto,q_auto/");
}
$("add").onclick = function () { openForm(null); };
$("dx").onclick = $("dc").onclick = function () { $("dlg").close(); };
async function nextId(T) {
  var r = await sb.from(cur).select("id"); var max = 0;
  (r.data || []).forEach(function (x) { var m = String(x.id).match(/(\d+)$/); if (m) max = Math.max(max, parseInt(m[1], 10)); });
  return T.prefix + String(max + 1).padStart(T.pad, "0");
}
$("ds").onclick = async function () {
  var T = TABLES[cur], obj = {}, pk = T.pk || "id";
  for (var i = 0; i < T.fields.length; i++) {
    var f = T.fields[i], el = $("f_" + f.k), v;
    if (f.t === "bool") v = el.checked;
    else { v = el.value.trim(); if (f.t === "int") v = v === "" ? null : parseInt(v, 10); else if (v === "") v = null; }
    if (f.req && (v === null || v === "")) { $("ferr").textContent = "Falta el campo: " + f.l; return; }
    obj[f.k] = v;
  }
  if (T.kv) { if (editing) obj.clave = editing.clave; else obj.clave = obj.clave.replace(/\s+/g, "_").toLowerCase(); }
  else obj.id = editing ? editing.id : await nextId(T);
  var r = await sb.from(cur).upsert(obj);
  if (r.error) { $("ferr").textContent = "Error: " + r.error.message; return; }
  $("dlg").close(); toast("Cambios guardados"); load(cur); buildCount(cur);
  try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf("nexo-sb::") === 0) localStorage.removeItem(k); }); } catch (e) {}
};
boot();
